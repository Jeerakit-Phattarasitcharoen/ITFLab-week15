<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOODPICKER ITF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #14171c;
      --panel:  #1d2128;
      --line:   #2d333d;
      --text:   #e8ecf2;
      --muted:  #8b95a5;
      --nav:    #4472c4;
      --btn:    #ee5f58;
      --marker: #f5c542;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    [hidden] {
      display: none !important;
    }

    body {
      font-family: 'Chakra Petch', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 16px 28px;
      background: var(--nav);
      font-weight: 600;
    }

    .navbar .id {
      font-size: .85rem;
      opacity: .9;
    }

    .navbar .brand {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .navbar .week {
      font-size: .85rem;
      opacity: .9;
      text-align: right;
    }


    /* ===== Layout ===== */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 16px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .case {
      position: relative;
      width: 100%;
      height: 210px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .case::before,
    .case::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 120px;
      z-index: 3;
      pointer-events: none;
    }

    .case::before {
      left: 0;
      background: linear-gradient(90deg, var(--panel), transparent);
    }

    .case::after {
      right: 0;
      background: linear-gradient(270deg, var(--panel), transparent);
    }

    .marker {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 3px;
      margin-left: -1.5px;
      z-index: 4;
      background: var(--marker);
      box-shadow: 0 0 12px var(--marker);
    }

    .marker::before {
      content: "";
      position: absolute;
      top: 0;
      left: -7px;
      border: 8px solid transparent;
      border-top-color: var(--marker);
      border-bottom: 0;
    }

    .track {
      display: flex;
      height: 100%;
      will-change: transform;
    }

    .item {
      flex: 0 0 160px;
      height: 100%;
      padding: 12px 10px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: linear-gradient(
        180deg,
        transparent 55%,
        color-mix(in srgb, var(--rc) 22%, transparent)
      );
      border-right: 1px solid var(--line);
      border-bottom: 5px solid var(--rc);
      transition: filter .4s, opacity .4s;
    }

    .item .pic {
      width: 128px;
      height: 118px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #262b34;
      font-size: 3rem;
    }

    .item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .item .nm {
      font-size: .82rem;
      font-weight: 600;
      line-height: 1.2;
      text-align: center;
    }

    .case.done .item:not(.win) {
      opacity: .35;
      filter: grayscale(.7);
    }

    .spin {
      width: min(100%, 360px);
      padding: 14px;
      border: 0;
      border-radius: 999px;
      background: var(--btn);
      color: #fff;
      font: 700 1.05rem 'Chakra Petch', sans-serif;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(238, 95, 88, .35);
      transition: transform .15s, filter .15s;
    }

    .spin:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .spin:active:not(:disabled) {
      transform: translateY(1px);
    }

    .spin:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .spin:focus-visible {
      outline: 3px solid var(--marker);
      outline-offset: 3px;
    }

    .card {
      width: min(100%, 300px);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-bottom: 5px solid var(--rc, #4b69ff);
      border-radius: 14px;
    }

    .card .pic {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #262b34;
      border-radius: 10px;
      color: var(--muted);
      font-size: 4rem;
      font-weight: 700;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card h2 {
      font-size: 1.4rem;
      color: var(--rc);
    }

    .card p {
      font-size: .9rem;
      color: var(--muted);
    }

    .price {
      margin-top: 4px;
      padding: 3px 14px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--rc) 22%, transparent);
      color: var(--rc);
      font-size: .85rem;
      font-weight: 600;
    }

    .card.pop {
      animation: pop .55s cubic-bezier(.2, 1.4, .4, 1);
    }

    @keyframes pop {
      0%   { transform: scale(.85); box-shadow: 0 0 0 var(--rc); }
      60%  { box-shadow: 0 0 40px var(--rc); }
      100% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card.pop {
        animation: none;
      }
    }

    @media (max-width: 560px) {
      .navbar {
        padding: 14px;
      }

      .navbar .brand {
        font-size: 1.05rem;
      }
    }
  </style>
</head>

<body>
  <nav class="navbar">
    <div class="id">69070024</div>
    <div class="brand">FOODPICKER ITF</div>
    <div class="week">Week15</div>
  </nav>
  <main>
    <div class="case" id="case" hidden>
      <div class="marker"></div>
      <div class="track" id="track"></div>
    </div>
    <button class="spin" id="spinBtn">สุ่มเมนูอาหาร</button>
    <article class="card" id="card" aria-live="polite">
      <div class="pic" id="cPic"></div>
      <h2 id="cName"></h2>
      <p id="cDesc"></p>
      <span class="price" id="cPrice"></span>
    </article>
  </main>
  <script src="script.js"></script>
</body>
</html>
